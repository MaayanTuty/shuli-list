<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>רשימת לידה</title>
    <meta name="description" content="רשימת התארגנות ללידה: ציוד לבית, תיק לידה ומעקב הוצאות.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#FAF6F0">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">

    <!-- התקנה למסך הבית -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="רשימת לידה">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <link rel="preload" href="fonts/assistant-400-hebrew.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/assistant-800-hebrew.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/varela-hebrew.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="hero stripes-bg">
        <div class="hero-card">
            <button type="button" class="hero-dog" id="heroDog" aria-label="שולי התחשית"></button>
            <span class="bubble" id="bubble" aria-hidden="true"></span>
            <h1 id="appTitle">רשימת לידה</h1>
            <p class="hero-sub" id="heroSub"></p>
        </div>
    </header>

    <main class="wrap" id="main">
        <div id="notices"></div>

        <!-- ציוד לבית / תיק לידה -->
        <section id="view-list" class="view" aria-labelledby="tab-home">
            <div class="toolbar" id="toolbar">
                <div class="search">
                    <input type="search" id="q" placeholder="חיפוש פריט…" aria-label="חיפוש פריט" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
                    <button type="button" class="search-clear" id="qClear" aria-label="ניקוי החיפוש" hidden>✕</button>
                </div>
                <div class="chips" id="chips" role="group" aria-label="סינון לפי סטטוס"></div>
            </div>
            <div id="list"></div>
        </section>

        <!-- דשבורד -->
        <section id="view-dash" class="view" hidden></section>

        <!-- הגדרות -->
        <section id="view-settings" class="view" hidden></section>
    </main>

    <nav class="tabbar" aria-label="ניווט ראשי">
        <div class="tabbar-in">
            <button type="button" class="tab active" id="tab-home" data-tab="home" aria-current="page"><span class="tab-ico" aria-hidden="true">🏠</span><span>ציוד לבית</span></button>
            <button type="button" class="tab" id="tab-bag" data-tab="bag"><span class="tab-ico" aria-hidden="true">🏥</span><span>תיק לידה</span></button>
            <button type="button" class="tab" id="tab-dash" data-tab="dash"><span class="tab-ico" aria-hidden="true">📊</span><span>דשבורד</span></button>
            <button type="button" class="tab" id="tab-settings" data-tab="settings"><span class="tab-ico" aria-hidden="true">⚙️</span><span>הגדרות</span></button>
        </div>
    </nav>

    <div class="saved" id="saved" aria-hidden="true">נשמר ✓</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="dlg" id="dlg" aria-labelledby="dlgTitle">
        <h2 id="dlgTitle"></h2>
        <p id="dlgBody"></p>
        <div class="btn-row">
            <button type="button" class="btn btn-soft" id="dlgCancel">ביטול</button>
            <button type="button" class="btn btn-primary" id="dlgOk">אישור</button>
        </div>
    </dialog>

    <datalist id="stores"></datalist>

    <noscript><p style="text-align:center;padding:24px">האפליקציה צריכה JavaScript כדי לעבוד.</p></noscript>

    <script src="shuli.js"></script>
    <script src="seed.js"></script>
    <script src="app.js"></script>
</body>
</html>
